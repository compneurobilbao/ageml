[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ageml"
version = "0.3.0"
description = "AgeML is a Python package for Age Modelling with Machine Learning made easy."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = "Apache-2.0"
keywords = ["Machine Learning", "Age Modelling", "Brain Age"]
classifiers = ["Topic :: Software Development :: Libraries :: Python Modules"]
authors = [
    { name = "Computational Neuroimaging Lab Bilbao, IIS Biobizkaia" },
    { name = "jorge.garcia.condado", email = "jorgegarciacondado@gmail.com" },
    { name = "inigo.tellaetxe", email = "inigotellaetxe@gmail.com" },
    { name = "asier.erramuzpe", email = "aerramuzpe@gmail.com" },
    { name = "jesus.cortes", email = "jesus.m.cortes@gmail.com" },
]
maintainers = [
    { name = "inigo.tellaetxe", email = "inigotellaetxe@gmail.com" },
    { name = "jorge.garcia.condado", email = "jorgegarciacondado@gmail.com" },
]
dependencies = [
    "numpy>=1.24,<2.0.0",
    "polars>=1.0.0",
    "scipy>=1.10",
    "statsmodels==0.14.0",
    "matplotlib>3.6",
    "scikit-learn>=1.3",
    "xgboost>=2.0.3,<3.0.0",
    "pillow>=10.3.0,<11.0.0",
]

[project.urls]
Repository = "https://github.com/compneurobilbao/ageml"

[project.scripts]
ageml = "ageml.__main__:main"
model_age = "ageml.commands:model_age"
model_feature_influence = "ageml.commands:model_feature_influence"
age_model_vs_logistic_regression = "ageml.commands:age_model_vs_logistic_regression"
factor_correlation = "ageml.commands:factor_correlation"
clinical_groups = "ageml.commands:clinical_groups"
clinical_classify = "ageml.commands:clinical_classify"
generate_ageml_data = "ageml.datasets.generate_synthetic_data:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "coverage-conditional-plugin>=0.7.0",
    "pre-commit>=3.0.0",
    "pytest",
    "pytest-cov",
    "flake8",
    "flake8-bugbear",
    "flake8-broken-line",
    "flake8-comprehensions",
    "ruff>=0.3.0",
    "ipykernel>=6.29.0",
    "nox",
]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
ignore = ["F403",# Imported but unused
"F403",# Unable to detect undefined names
"B028",# No explicit stacklevel keyword argument found
"W293",# blank line contains whitespace (I don't like this rule, interferes with good function indentation)
"C419",# Unnecessary list comprehension passed to all() prevents short-circuiting - rewrite as a generator
"E702",# Multiple statements on one line (semicolon)
"B023",# Function definition does not bind loop variable 'some_var_name'.
]

[tool.coverage.run]
plugins = ["coverage_conditional_plugin"]
